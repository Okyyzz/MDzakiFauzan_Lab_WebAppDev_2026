<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Document</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                text-align: center;
                margin-top: 40px;
                color: #333;
            }
            h1 {
                color: #007BFF;
            }
        </style>
    </head>
    <body>
        <h1 id="judul">Halooo</h1>
        <p>Buka console untuk melihat pesan tambahan dari JavaScript</p>
        <script>
             // kalo ditulis didalem browser akan sekali pake, dan susah untuk bug fixing kalau pake js eksternal bisa dipake berkali kali lebih gampang untuk bug fixing
             // browser = bagus untuk script pendek, eksternal = bagus untuk script panjang
            // const = immutable, let = mutable
            const nama = "Reztu Valdhemar Zahran Fadhiel";
            console.log(`Halo, ${nama}! Selamat datang di JavaScript!`);
            // Menambahkan event listener untuk mengubah teks saat diklik
            document.getElementById("judul").textContent = `Selamat datang, ${nama}!`;
        </script>
    </body>
